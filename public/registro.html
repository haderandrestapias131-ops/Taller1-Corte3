<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro de Emprendimientos - Feria</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">

  <div class="card" style="width: 100%; max-width: 480px; padding: 40px; box-shadow: var(--shadow-glow);">
    <div style="text-align: center; margin-bottom: 24px;">
      <h1 style="font-size: 1.6rem; margin-bottom: 6px;">Inscribir Emprendimiento</h1>
      <p style="color: var(--text-muted); font-size: 0.88rem;">Únete a la feria como expositor</p>
    </div>

    <div id="alerta" class="alert"></div>

    <form id="form-registro" style="display: flex; flex-direction: column; gap: 16px;">
      <div class="form-group">
        <label>Nombre del Responsable</label>
        <input type="text" id="reg-nombre" placeholder="Tu nombre completo" required>
      </div>

      <div class="form-group">
        <label>Correo Electrónico</label>
        <input type="email" id="reg-correo" placeholder="correo@ejemplo.com" required>
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="reg-password" placeholder="••••••••" required>
      </div>

      <div class="form-group">
        <label>Nombre del Emprendimiento</label>
        <input type="text" id="reg-emprendimiento" placeholder="Ej. Creaciones Artesanales" required>
      </div>

      <div class="form-group">
        <label>Categoría</label>
        <select id="reg-categoria" required>
          <option value="">Selecciona una categoría</option>
          <option value="Artesanías">Artesanías</option>
          <option value="Gastronomía">Gastronomía</option>
          <option value="Tecnología">Tecnología</option>
          <option value="Moda">Moda</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary" style="padding: 14px; margin-top: 8px;">Enviar Solicitud de Registro</button>
    </form>

    <div style="text-align: center; margin-top: 24px; border-top: 1px solid var(--border); padding-top: 20px; display: flex; flex-direction: column; gap: 10px; font-size: 0.88rem;">
      <p style="color: var(--text-muted);">¿Ya tienes cuenta de expositor o admin? <a href="/login.html" style="color: var(--primary); font-weight: 700; text-decoration: none;">Inicia sesión</a></p>
      <p><a href="/cliente.html" style="color: var(--accent); font-weight: 600; text-decoration: none;">Ir a la Tienda Pública 🛒</a></p>
    </div>
  </div>

  <script>
    function mostrarAlerta(mensaje, esError = false) {
      const alerta = document.getElementById('alerta');
      alerta.className = `alert ${esError ? 'alert-error' : 'alert-success'}`;
      alerta.innerText = mensaje;
      alerta.style.display = 'block';
      setTimeout(() => { alerta.style.display = 'none'; }, 4000);
    }

    document.getElementById('form-registro').addEventListener('submit', async (e) => {
      e.preventDefault();

      const datos = {
        nombre: document.getElementById('reg-nombre').value,
        correo: document.getElementById('reg-correo').value,
        password: document.getElementById('reg-password').value,
        nombre_emprendimiento: document.getElementById('reg-emprendimiento').value,
        categoria: document.getElementById('reg-categoria').value
      };

      try {
        const respuesta = await fetch('/auth/registro', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(datos)
        });

        const resultado = await respuesta.json();

        if (respuesta.ok && resultado.estado === 'exitoso') {
          mostrarAlerta(resultado.mensaje);
          document.getElementById('form-registro').reset();
          setTimeout(() => { window.location.href = '/login.html'; }, 2000);
        } else {
          throw new Error(resultado.mensaje || 'Error en el registro');
        }
      } catch (error) {
        mostrarAlerta(error.message, true);
      }
    });
  </script>
</body>
</html>
