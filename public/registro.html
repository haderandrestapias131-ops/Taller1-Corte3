
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Registro - Feria de Emprendimientos</title>

  <link rel="stylesheet" href="estilos.css">
  <link rel="stylesheet" href="autenticacion.css">
</head>

<body class="auth-page">

  <main class="auth-card auth-card--register">

    <header class="auth-header">
      <h1 class="auth-title">
        Inscribir Emprendimiento
      </h1>

      <p class="auth-subtitle">
        Únete a la feria como expositor
      </p>
    </header>

    <div id="alerta" class="alert" role="status" aria-live="polite"></div>

    <form id="form-registro" class="auth-form">

      <div class="form-group">
        <label for="reg-nombre">Nombre del Responsable</label>

        <input
          type="text"
          id="reg-nombre"
          name="nombre"
          placeholder="Tu nombre completo"
          autocomplete="name"
          required
        >
      </div>

      <div class="form-group">
        <label for="reg-correo">Correo Electrónico</label>

        <input
          type="email"
          id="reg-correo"
          name="correo"
          placeholder="Correo@ejemplo.com"
          autocomplete="email"
          required
        >
      </div>

      <div class="form-group">
        <label for="reg-password">Contraseña</label>

        <input
          type="password"
          id="reg-password"
          name="password"
          placeholder="••••••••"
          autocomplete="new-password"
          required
        >
      </div>

      <div class="form-group">
        <label for="reg-emprendimiento">Nombre del Emprendimiento</label>

        <input
          type="text"
          id="reg-emprendimiento"
          name="nombre_emprendimiento"
          placeholder="Ej. Creaciones Artesanales"
          required
        >
      </div>

      <div class="form-group">
        <label for="reg-categoria">Categoría</label>

        <select id="reg-categoria" name="categoria" required>
          <option value="">Selecciona una categoría</option>
          <option value="Artesanías">Artesanías</option>
          <option value="Gastronomía">Gastronomía</option>
          <option value="Tecnología">Tecnología</option>
          <option value="Moda">Moda</option>
        </select>
      </div>

      <button type="submit" class="auth-button">
        Enviar Solicitud de Registro
      </button>

    </form>

    <footer class="auth-footer">
      <hr class="auth-divider">

      <p>
        ¿Ya tienes cuenta de expositor o admin?
        <a href="/login.html" class="auth-secondary-link">
          Inicia sesión
        </a>
      </p>

      <a href="/cliente.html" class="auth-public-link">
        Ir a la Tienda Pública
      </a>
    </footer>

  </main>

  <script>
    function mostrarAlerta(mensaje, esError = false) {
      const alerta = document.getElementById('alerta');

      alerta.className = `alert ${esError ? 'alert-error' : 'alert-success'}`;
      alerta.innerText = mensaje;
      alerta.style.display = 'block';

      setTimeout(() => {
        alerta.style.display = 'none';
      }, 4000);
    }

    document.getElementById('form-registro').addEventListener('submit', async (e) => {
      e.preventDefault();

      const datos = {
        nombre: document.getElementById('reg-nombre').value,
        correo: document.getElementById('reg-correo').value,
        password: document.getElementById('reg-password').value,
        nombre_emprendimiento: document.getElementById('reg-emprendimiento').value,
        categoria: document.getElementById('reg-categoria').value
      };

      try {
        const respuesta = await fetch('/auth/registro', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(datos)
        });

        const resultado = await respuesta.json();

        if (respuesta.ok && resultado.estado === 'exitoso') {
          mostrarAlerta(resultado.mensaje);
          document.getElementById('form-registro').reset();

          setTimeout(() => {
            window.location.href = '/login.html';
          }, 2000);
        } else {
          throw new Error(resultado.mensaje || 'Error en el registro');
        }
      } catch (error) {
        mostrarAlerta(error.message, true);
      }
    });
  </script>

</body>
</html>
