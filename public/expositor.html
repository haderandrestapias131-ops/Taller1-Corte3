<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Portal del Expositor</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <div class="container">
    <header>
      <div style="display: flex; align-items: center; gap: 14px;">
        <h1>Portal del Expositor</h1>
        <span class="badge-role">Expositor</span>
      </div>
      <div style="display: flex; gap: 10px;">
        <a href="/cliente.html" class="btn btn-ghost">Ver Tienda 🛒</a>
        <button onclick="cerrarSesion()" class="btn btn-eliminar">Cerrar Sesión</button>
      </div>
    </header>

    <div id="alerta" class="alert"></div>

    <div class="card">
      <h2>Gestión de Catálogo</h2>

      <div style="display: flex; gap: 12px; align-items: flex-end; margin-bottom: 24px;">
        <div class="form-group" style="width: 160px;">
          <label>ID Expositor</label>
          <input type="number" id="input-id-expositor" readonly style="background: rgba(0,0,0,0.3);">
        </div>
        <button class="btn btn-ghost" onclick="cargarCatalogoExpositor()">Cargar Mi Catálogo</button>
      </div>

      <div id="panel-productos" style="display: none; border-top: 1px solid var(--border); padding-top: 24px;">
        <h3 style="font-size: 1.05rem; font-weight: 700; margin-bottom: 20px;">Publicar Nuevo Producto / Servicio</h3>

        <form id="form-producto" style="display: grid; gap: 18px; grid-template-columns: 1fr 1fr; margin-bottom: 36px;">
          <div class="form-group">
            <label>Nombre del Producto</label>
            <input type="text" id="prod-nombre" required placeholder="Ej. Artesanía en madera">
          </div>
          <div class="form-group">
            <label>Precio ($)</label>
            <input type="number" step="0.01" id="prod-precio" required placeholder="19.99">
          </div>
          <div class="form-group" style="grid-column: 1 / -1;">
            <label>URL Imagen (Opcional)</label>
            <input type="url" id="prod-imagen" placeholder="https://imagen.com/foto.jpg">
          </div>
          <div class="form-group" style="grid-column: 1 / -1;">
            <label>Descripción</label>
            <textarea id="prod-descripcion" rows="3" placeholder="Detalla las características principales..."></textarea>
          </div>
          <div style="grid-column: 1 / -1;">
            <button type="submit" class="btn btn-primary" style="padding: 12px 24px;">Publicar Producto</button>
          </div>
        </form>

        <h3 style="font-size: 1.05rem; font-weight: 700; margin-bottom: 16px;">Productos Registrados</h3>
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Imagen</th>
                <th>Producto</th>
                <th>Descripción</th>
                <th>Precio</th>
                <th style="text-align: right;">Acciones</th>
              </tr>
            </thead>
            <tbody id="tabla-productos">
              <tr>
                <td colspan="6" style="text-align: center; color: var(--text-muted);">Sin productos publicados.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="expositor.js"></script>
</body>
</html>
