<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Catálogo Público - Feria de Emprendimientos</title>
  <link rel="stylesheet" href="estilos.css">
  <style>
    .grid-productos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 24px;
      margin-top: 20px;
    }
    .card-prod {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.3s ease;
    }
    .card-prod:hover {
      transform: translateY(-6px);
      border-color: var(--border-focus);
      box-shadow: var(--shadow-glow);
    }
    .card-prod img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      background-color: #020617;
    }
    .card-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .tag-cat {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }
    .price-tag {
      font-size: 1.3rem;
      font-weight: 800;
      color: #34d399;
      margin-top: auto;
      padding-top: 14px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1>Feria de Emprendimientos</h1>
        <p style="font-size: 0.85rem; color: var(--text-muted);">Productos y Servicios Avalados</p>
      </div>
      <div>
        <a href="/login.html" class="btn btn-primary">Iniciar Sesión</a>
      </div>
    </header>

    <main>
      <div id="grid-productos" class="grid-productos">
        <p style="color: var(--text-muted);">Cargando catálogo oficial...</p>
      </div>
    </main>
  </div>

  <script src="cliente.js"></script>
</body>
</html>
