
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Iniciar Sesión - Feria de Emprendimientos</title>

  <link rel="stylesheet" href="estilos.css">
  <link rel="stylesheet" href="autenticacion.css">
</head>

<body class="auth-page">

  <main class="auth-card">

    <header class="auth-header">
      <h1 class="auth-title">
        Feria de<br>
        Emprendimientos
      </h1>

      <p class="auth-subtitle">
        Acceso para Administradores y Expositores
      </p>
    </header>

    <form id="form-login" class="auth-form">

      <div class="form-group">
        <label for="login-correo">Correo Electrónico</label>

        <input
          type="email"
          id="login-correo"
          name="correo"
          placeholder="Correo@ejemplo.com"
          autocomplete="username"
          required
        >
      </div>

      <div class="form-group">
        <label for="login-password">Contraseña</label>

        <input
          type="password"
          id="login-password"
          name="password"
          placeholder="••••••••"
          autocomplete="current-password"
          required
        >
      </div>

      <button type="submit" class="auth-button">
        Iniciar Sesión
      </button>

    </form>

    <footer class="auth-footer">
      <hr class="auth-divider">

      <p>
        ¿Tienes un emprendimiento?
        <a href="/registro.html" class="auth-secondary-link">
          Inscribe tu negocio aquí
        </a>
      </p>

      <a href="/cliente.html" class="auth-public-link">
        Ver Catálogo / Tienda Pública
      </a>
    </footer>

  </main>

  <script src="login.js"></script>

</body>
</html>
