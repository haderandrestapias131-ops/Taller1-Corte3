<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Iniciar Sesión - Feria</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">

  <div class="card" style="width: 100%; max-width: 420px; padding: 40px; box-shadow: var(--shadow-glow);">
    <div style="text-align: center; margin-bottom: 28px;">
      <h1 style="font-size: 1.8rem; margin-bottom: 6px;">Feria de Emprendimientos</h1>
      <p style="color: var(--text-muted); font-size: 0.88rem;">Acceso para Administradores y Expositores</p>
    </div>

    <form id="form-login" style="display: flex; flex-direction: column; gap: 18px;">
      <div class="form-group">
        <label>Correo Electrónico</label>
        <input type="email" id="login-correo" placeholder="correo@ejemplo.com" required>
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="login-password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary" style="padding: 14px; margin-top: 8px;">Iniciar Sesión</button>
    </form>

    <div style="text-align: center; margin-top: 28px; border-top: 1px solid var(--border); padding-top: 20px; display: flex; flex-direction: column; gap: 12px; font-size: 0.88rem;">
      <p style="color: var(--text-muted);">¿Tienes un emprendimiento? <a href="/registro.html" style="color: var(--primary); font-weight: 700; text-decoration: none;">Inscribe tu negocio aquí</a></p>
      <p><a href="/cliente.html" style="color: var(--accent); font-weight: 600; text-decoration: none;">Ver Catálogo / Tienda Pública 🛒</a></p>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
