<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel de Administración</title>
  <link rel="stylesheet" href="estilos.css">
  <style>
    /* Estilos del Modal de Edición */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      justify-content: center; align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 32px; width: 100%; max-width: 480px;
      box-shadow: var(--shadow-card);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div style="display: flex; align-items: center; gap: 14px;">
        <h1>Panel de Administración</h1>
        <span class="badge-role">Administrador</span>
      </div>
      <div style="display: flex; gap: 10px;">
        <a href="/cliente.html" class="btn btn-ghost">Ver Tienda 🛒</a>
        <button onclick="cerrarSesion()" class="btn btn-eliminar">Cerrar Sesión</button>
      </div>
    </header>

    <div id="alerta" class="alert"></div>

    <div class="card">
      <h2>Solicitudes y Registro de Emprendimientos</h2>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Emprendimiento</th>
              <th>Expositor</th>
              <th>Correo</th>
              <th>Categoría</th>
              <th>Estado</th>
              <th style="text-align: right;">Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-expositores">
            <tr>
              <td colspan="7" style="text-align: center; color: var(--text-muted);">Cargando lista de emprendimientos...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- MODAL PARA EDITAR EXPOSITOR -->
  <div id="modal-editar" class="modal">
    <div class="modal-content">
      <h3 style="font-size: 1.2rem; margin-bottom: 20px;">Editar Información de Emprendimiento</h3>
      <form id="form-editar-expositor" style="display: flex; flex-direction: column; gap: 16px;">
        <input type="hidden" id="edit-id">
        
        <div class="form-group">
          <label>Nombre del Expositor</label>
          <input type="text" id="edit-nombre" required>
        </div>

        <div class="form-group">
          <label>Correo Electrónico</label>
          <input type="email" id="edit-correo" required>
        </div>

        <div class="form-group">
          <label>Nombre del Emprendimiento</label>
          <input type="text" id="edit-emprendimiento" required>
        </div>

        <div class="form-group">
          <label>Categoría</label>
          <select id="edit-categoria" required>
            <option value="Artesanías">Artesanías</option>
            <option value="Gastronomía">Gastronomía</option>
            <option value="Tecnología">Tecnología</option>
            <option value="Moda">Moda</option>
          </select>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 10px; justify-content: flex-end;">
          <button type="button" class="btn btn-ghost" onclick="cerrarModal()">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar Cambios</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let expositoresData = [];

    document.addEventListener('DOMContentLoaded', cargarExpositores);

    function mostrarAlerta(mensaje, esError = false) {
      const alerta = document.getElementById('alerta');
      alerta.className = `alert ${esError ? 'alert-error' : 'alert-success'}`;
      alerta.innerText = mensaje;
      alerta.style.display = 'block';
      setTimeout(() => { alerta.style.display = 'none'; }, 4000);
    }

    async function cargarExpositores() {
      try {
        const respuesta = await fetch('/feria/listar-todos');
        const resultado = await respuesta.json();

        if (resultado.estado !== 'exitoso') throw new Error(resultado.mensaje);

        expositoresData = resultado.datos;
        const tabla = document.getElementById('tabla-expositores');
        tabla.innerHTML = '';

        if (expositoresData.length === 0) {
          tabla.innerHTML = '<tr><td colspan="7" style="text-align: center;">No hay registros actualmente.</td></tr>';
          return;
        }

        expositoresData.forEach(exp => {
          const fila = document.createElement('tr');
          fila.innerHTML = `
            <td>#${exp.id}</td>
            <td><strong>${exp.nombre_emprendimiento}</strong></td>
            <td>${exp.nombre}</td>
            <td>${exp.correo}</td>
            <td><span style="color: var(--accent); font-weight:600;">${exp.categoria}</span></td>
            <td><span class="status status-${exp.estado}">${exp.estado}</span></td>
            <td style="text-align: right; display: flex; gap: 6px; justify-content: flex-end;">
              ${exp.estado === 'pendiente' ? `
                <button class="btn btn-aval" onclick="cambiarEstado(${exp.id}, 'aprobado', '${exp.categoria}')">Avalar</button>
                <button class="btn btn-rechazar" onclick="cambiarEstado(${exp.id}, 'rechazado', '${exp.categoria}')">Rechazar</button>
              ` : ''}
              <button class="btn btn-ghost" onclick="abrirModalEditar(${exp.id})">Editar</button>
              <button class="btn btn-ghost" style="color: var(--danger);" onclick="eliminarExpositor(${exp.id})">Eliminar</button>
            </td>
          `;
          tabla.appendChild(fila);
        });

      } catch (error) {
        mostrarAlerta('Error al cargar datos: ' + error.message, true);
      }
    }

    // Modal & Edición
    function abrirModalEditar(id) {
      const exp = expositoresData.find(e => e.id === id);
      if (!exp) return;

      document.getElementById('edit-id').value = exp.id;
      document.getElementById('edit-nombre').value = exp.nombre;
      document.getElementById('edit-correo').value = exp.correo;
      document.getElementById('edit-emprendimiento').value = exp.nombre_emprendimiento;
      document.getElementById('edit-categoria').value = exp.categoria;

      document.getElementById('modal-editar').style.display = 'flex';
    }

    function cerrarModal() {
      document.getElementById('modal-editar').style.display = 'none';
    }

    document.getElementById('form-editar-expositor').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('edit-id').value;
      const datos = {
        nombre: document.getElementById('edit-nombre').value,
        correo: document.getElementById('edit-correo').value,
        nombre_emprendimiento: document.getElementById('edit-emprendimiento').value,
        categoria: document.getElementById('edit-categoria').value
      };

      try {
        const respuesta = await fetch(`/feria/actualizar/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(datos)
        });

        const resultado = await respuesta.json();
        if (respuesta.ok && resultado.estado === 'exitoso') {
          mostrarAlerta('Emprendimiento actualizado correctamente');
          cerrarModal();
          cargarExpositores();
        } else {
          throw new Error(resultado.mensaje);
        }
      } catch (error) {
        mostrarAlerta(error.message, true);
      }
    });

    async function cambiarEstado(id, nuevoEstado, categoria) {
      try {
        const respuesta = await fetch(`/feria/cambiar-estado/${id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ estado: nuevoEstado, categoria: categoria })
        });

        const resultado = await respuesta.json();
        if (respuesta.ok && resultado.estado === 'exitoso') {
          mostrarAlerta(resultado.mensaje);
          cargarExpositores();
        } else {
          throw new Error(resultado.mensaje);
        }
      } catch (error) {
        mostrarAlerta(error.message, true);
      }
    }

    async function eliminarExpositor(id) {
      if (!confirm('¿Seguro que deseas eliminar este registro?')) return;
      try {
        const respuesta = await fetch(`/feria/eliminar/${id}`, { method: 'DELETE' });
        const resultado = await respuesta.json();

        if (respuesta.ok && resultado.estado === 'exitoso') {
          mostrarAlerta(resultado.mensaje);
          cargarExpositores();
        } else {
          throw new Error(resultado.mensaje);
        }
      } catch (error) {
        mostrarAlerta(error.message, true);
      }
    }

    function cerrarSesion() {
      localStorage.removeItem('usuario');
      window.location.href = '/login.html';
    }
  </script>
</body>
</html>
