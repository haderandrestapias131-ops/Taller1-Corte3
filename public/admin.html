<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel de Administración</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <div class="container">
    <header>
      <div style="display: flex; align-items: center; gap: 14px;">
        <h1>Panel de Administración</h1>
        <span class="badge-role">Administrador</span>
      </div>
      <div style="display: flex; gap: 10px;">
        <a href="/cliente.html" class="btn btn-ghost">Ver Tienda 🛒</a>
        <button onclick="cerrarSesion()" class="btn btn-eliminar">Cerrar Sesión</button>
      </div>
    </header>

    <div id="alerta" class="alert"></div>

    <div class="card">
      <h2>Solicitudes y Registro de Emprendimientos</h2>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Emprendimiento</th>
              <th>Expositor</th>
              <th>Correo</th>
              <th>Categoría</th>
              <th>Estado</th>
              <th style="text-align: right;">Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-expositores">
            <tr>
              <td colspan="7" style="text-align: center; color: var(--text-muted);">Cargando lista de emprendimientos...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', cargarExpositores);

    function mostrarAlerta(mensaje, esError = false) {
      const alerta = document.getElementById('alerta');
      alerta.className = `alert ${esError ? 'alert-error' : 'alert-success'}`;
      alerta.innerText = mensaje;
      alerta.style.display = 'block';
      setTimeout(() => { alerta.style.display = 'none'; }, 4000);
    }

    async function cargarExpositores() {
      try {
        const respuesta = await fetch('/feria/listar-todos');
        const resultado = await respuesta.json();

        if (resultado.estado !== 'exitoso') throw new Error(resultado.mensaje);

        const tabla = document.getElementById('tabla-expositores');
        tabla.innerHTML = '';

        if (resultado.datos.length === 0) {
          tabla.innerHTML = '<tr><td colspan="7" style="text-align: center;">No hay registros actualmente.</td></tr>';
          return;
        }

        resultado.datos.forEach(exp => {
          const fila = document.createElement('tr');
          fila.innerHTML = `
            <td>#${exp.id}</td>
            <td><strong>${exp.nombre_emprendimiento}</strong></td>
            <td>${exp.nombre}</td>
            <td>${exp.correo}</td>
            <td><span style="color: var(--accent); font-weight:600;">${exp.categoria}</span></td>
            <td><span class="status status-${exp.estado}">${exp.estado}</span></td>
            <td style="text-align: right;">
              ${exp.estado === 'pendiente' ? `
                <button class="btn btn-aval" onclick="cambiarEstado(${exp.id}, 'aprobado', '${exp.categoria}')">Avalar</button>
                <button class="btn btn-rechazar" onclick="cambiarEstado(${exp.id}, 'rechazado', '${exp.categoria}')">Rechazar</button>
              ` : ''}
              <button class="btn btn-ghost" onclick="eliminarExpositor(${exp.id})">Eliminar</button>
            </td>
          `;
          tabla.appendChild(fila);
        });

      } catch (error) {
        mostrarAlerta('Error al cargar datos: ' + error.message, true);
      }
    }

    async function cambiarEstado(id, nuevoEstado, categoria) {
      try {
        const respuesta = await fetch(`/feria/cambiar-estado/${id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ estado: nuevoEstado, categoria: categoria })
        });

        const resultado = await respuesta.json();
        if (respuesta.ok && resultado.estado === 'exitoso') {
          mostrarAlerta(resultado.mensaje);
          cargarExpositores();
        } else {
          throw new Error(resultado.mensaje);
        }
      } catch (error) {
        mostrarAlerta(error.message, true);
      }
    }

    async function eliminarExpositor(id) {
      if (!confirm('¿Seguro que deseas eliminar este registro?')) return;
      try {
        const respuesta = await fetch(`/feria/eliminar/${id}`, { method: 'DELETE' });
        const resultado = await respuesta.json();

        if (respuesta.ok && resultado.estado === 'exitoso') {
          mostrarAlerta(resultado.mensaje);
          cargarExpositores();
        } else {
          throw new Error(resultado.mensaje);
        }
      } catch (error) {
        mostrarAlerta(error.message, true);
      }
    }

    function cerrarSesion() {
      localStorage.removeItem('usuario');
      window.location.href = '/login.html';
    }
  </script>
</body>
</html>
